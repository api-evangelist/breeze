openapi: 3.1.0
info:
  title: Breeze Admin Selective Yield Sources API
  description: A comprehensive API for managing yield farming operations, funds, and user authentication
  contact:
    name: Breeze Team
    email: support@breeze.com
  license:
    name: Proprietary
    url: https://breeze.com/license
  version: 1.0.0
servers:
- url: http://localhost:8080
  description: Local development server
- url: https://api.breeze.com
  description: Production server
tags:
- name: Selective Yield Sources
paths:
  /organization/get-selective-yield-sources:
    post:
      tags:
      - Selective Yield Sources
      operationId: get_selective_yield_sources
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiInputToGetSelectiveYieldSources'
        required: true
      responses:
        '200':
          description: selective yield sources fetched successfully
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer_auth: []
components:
  schemas:
    ErrorResponse:
      type: object
      required:
      - message
      properties:
        message:
          type: string
          description: Error message description
    ApiInputToGetSelectiveYieldSources:
      type: object
      required:
      - mint
      properties:
        mint:
          type: string
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: x-api-key
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
