components:
  schemas:
    ApiSelectiveYieldSources:
      type: object
      required:
      - mint
      - yield_sources
      properties:
        mint:
          type: string
        yield_sources:
          $ref: '#/components/schemas/ApiSelectiveYieldSource'
    ApiJobStatus:
      type: object
      required:
      - job_id
      - job_type
      - payload
      - state
      - created_at
      - updated_at
      properties:
        additional_fund_metadata:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ApiFundWithBaseAssetMapper'
        created_at:
          type: integer
          format: int64
          minimum: 0
        error:
          type:
          - string
          - 'null'
        job_id:
          type: string
        job_type:
          type: string
        payload:
          type: string
        state:
          type: string
        updated_at:
          type: integer
          format: int64
          minimum: 0
    AdminOrganizationMember:
      type: object
      description: Organization member from Clerk
      required:
      - id
      - user_id
      - identifier
      - role
      - created_at
      properties:
        created_at:
          type: integer
          format: int64
          description: When the membership was created (Unix timestamp)
          minimum: 0
        first_name:
          type:
          - string
          - 'null'
          description: User's first name
        id:
          type: string
          description: Membership ID
        identifier:
          type: string
          description: User's email or identifier
        image_url:
          type:
          - string
          - 'null'
          description: User's profile image URL
        last_name:
          type:
          - string
          - 'null'
          description: User's last name
        role:
          type: string
          description: Role in the organization (e.g., "org:admin", "org:member")
        user_id:
          type: string
          description: User ID
    AdminStrategyFee:
      type: object
      description: Fee info for admin strategy detail
      required:
      - fee_bps
      - fee_recipient
      - fee_type
      - frequency_seconds
      properties:
        fee_bps:
          type: integer
          format: int32
          minimum: 0
        fee_recipient:
          type: string
        fee_type:
          type: string
        frequency_seconds:
          type: integer
          format: int64
          minimum: 0
    ApiSelectiveYieldSource:
      type: object
      properties:
        drift_lending:
          type:
          - string
          - 'null'
        jup_lend:
          type:
          - string
          - 'null'
        kamino:
          type:
          - string
          - 'null'
        marginfiv2:
          type:
          - string
          - 'null'
    CreateOrganizationInviteRequest:
      type: object
      description: Request body for creating an organization invitation
      required:
      - email_address
      properties:
        email_address:
          type: string
          description: Email address to send the invitation to
        inviter_user_id:
          type:
          - string
          - 'null'
          description: 'Optional: User ID of the person creating the invitation (for tracking purposes)'
        role:
          type: string
          description: Role to assign to the invited user (e.g., "org:member", "org:admin")
    RevokeOrganizationInviteResponse:
      type: object
      description: Response for revoking an organization invitation
      required:
      - invitation
      - message
      properties:
        invitation:
          $ref: '#/components/schemas/AdminOrganizationInvitation'
          description: The revoked invitation details
        message:
          type: string
          description: Success message
    ApiCancelJobResult:
      type: object
      required:
      - message
      - job_id
      - previous_state
      - new_state
      properties:
        job_id:
          type: string
        message:
          type: string
        new_state:
          type: string
        previous_state:
          type: string
    PaginatedResponse:
      type: object
      description: Paginated response wrapper
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProtocolYieldSources'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
          description: Pagination metadata
    ApiFundRebalanceSettings:
      type: object
      required:
      - fund_id
      properties:
        fund_id:
          type: string
        min_position_settle_time:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        min_rebalance_value:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        rebalance_period:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        unallocated_threshold:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
    ApiStrategyMetricUniversal:
      type: object
      required:
      - start
      - end
      - aggregation_window
      - strategy_id
      - data
      - combined_asset_value_over_time
      - per_asset_value_over_time
      - fee_distribution_metrics
      properties:
        aggregation_window:
          type: string
          description: Aggregation window (e.g., "1h", "1d", "5m") representing time between data points
        combined_asset_value_over_time:
          type: array
          items:
            $ref: '#/components/schemas/CombinedAssetValueOverTime'
        data:
          type: array
          items:
            $ref: '#/components/schemas/UniversalStrategyMetrics'
          description: Array of aggregated metric data points
        end:
          type: string
          description: End timestamp of the data range
        fee_distribution_metrics:
          type: array
          items:
            $ref: '#/components/schemas/ApiDailyFeeDistribution'
        per_asset_value_over_time:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/AssetValuePair'
          propertyNames:
            type: string
        start:
          type: string
          description: Start timestamp of the data range
        strategy_id:
          type: array
          items:
            type: string
          description: Strategy ID for the metrics
    AdminMetricsResponse:
      type: object
      description: 'Admin metrics response - aggregates ALL strategies/funds platform-wide

        Same structure as strategy/metrics but for entire platform'
      required:
      - start
      - end
      - aggregation_window
      - total_strategies
      - total_funds
      - data
      - combined_asset_value_over_time
      - per_asset_value_over_time
      - fee_distribution_metrics
      properties:
        aggregation_window:
          type: string
          description: Aggregation window (e.g., "1h", "1d", "5m")
        combined_asset_value_over_time:
          type: array
          items:
            $ref: '#/components/schemas/CombinedAssetValueOverTime'
          description: Combined asset value over time (all assets)
        data:
          type: array
          items:
            $ref: '#/components/schemas/UniversalStrategyMetrics'
          description: Array of aggregated metric data points over time
        end:
          type: string
          description: End timestamp of the data range
        fee_distribution_metrics:
          type: array
          items:
            $ref: '#/components/schemas/ApiDailyFeeDistribution'
          description: Fee distribution metrics over time
        per_asset_value_over_time:
          type: object
          description: Per-asset value over time
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/AssetValuePair'
          propertyNames:
            type: string
        start:
          type: string
          description: Start timestamp of the data range
        total_funds:
          type: integer
          description: Total number of funds included
          minimum: 0
        total_strategies:
          type: integer
          description: Total number of strategies included
          minimum: 0
    ApiAssignFundToOrganization:
      type: object
      required:
      - organization_id
      - organization_fund_id
      properties:
        organization_fund_id:
          type: string
        organization_id:
          type: string
    ApiDailyFeeDistribution:
      type: object
      required:
      - time
      - total_amount_distributed
      properties:
        time:
          type: string
        total_amount_distributed:
          type: number
          format: double
    ApiUpdateFundDelegatedWithdrawerRequest:
      type: object
      required:
      - fund_id
      properties:
        delegated_withdrawer:
          type:
          - string
          - 'null'
          description: Set to `null` to clear the delegated withdrawer.
        fund_id:
          type: string
    CreateOrganizationInviteResponse:
      type: object
      description: Response for creating an organization invitation
      required:
      - invitation
      - message
      properties:
        invitation:
          $ref: '#/components/schemas/AdminOrganizationInvitation'
          description: The created invitation details
        message:
          type: string
          description: Success message
    AdminStrategyCurrentData:
      type: object
      description: Current live data for admin strategy detail
      required:
      - tvl_usd
      - total_deposits_usd
      - yield_earnings_usd
      - total_users
      - total_fees_distributed_usd
      - apy
      - allocated_usd
      - unallocated_usd
      - protocol_allocations
      properties:
        allocated_usd:
          type: number
          format: double
          description: Allocated to yield (USD)
        apy:
          type: number
          format: double
          description: Weighted APY
        protocol_allocations:
          type: array
          items:
            $ref: '#/components/schemas/ProtocolValues'
          description: Protocol breakdown
        total_deposits_usd:
          type: number
          format: double
          description: Total deposits (USD) - from user_fund table
        total_fees_distributed_usd:
          type: number
          format: double
          description: Total fees distributed (USD)
        total_users:
          type: integer
          format: int64
          description: Total unique users
          minimum: 0
        tvl_usd:
          type: number
          format: double
          description: Total value locked (USD)
        unallocated_usd:
          type: number
          format: double
          description: Unallocated amount (USD)
        yield_earnings_usd:
          type: number
          format: double
          description: 'Yield earnings: TVL - deposits'
    StrategyInstanceStatus:
      type: string
      enum:
      - active
      - pending
      - failed
      - updating
    FundMetricDataPoint:
      type: object
      description: Single fund metric data point
      required:
      - time
      - current_value_usd
      - current_value
      - allocated_to_yield_usd
      - allocated_to_yield
      - unallocated_amount_usd
      - unallocated_amount
      - total_deposits
      - deposits_usd
      - withdrawals_usd
      - current_apy
      - risk_level
      - share_price
      - base_asset_price_usd
      - user_count
      - allocation_count
      properties:
        allocated_to_yield:
          type: number
          format: double
          description: Amount allocated to yield in base asset
        allocated_to_yield_usd:
          type: number
          format: double
          description: Amount allocated to yield in USD
        allocation_count:
          type: number
          format: double
          description: Number of allocations
        base_asset_price_usd:
          type: number
          format: double
          description: Base asset price in USD
        current_apy:
          type: number
          format: double
          description: Current APY
        current_value:
          type: number
          format: double
          description: Current value in base asset (with decimals applied)
        current_value_usd:
          type: number
          format: double
          description: Current value in USD
        deposits_usd:
          type: number
          format: double
          description: Deposits in USD
        risk_level:
          type: number
          format: double
          description: Risk level
        share_price:
          type: number
          format: double
          description: Share price
        time:
          type: string
          description: Timestamp (ISO 8601)
        total_deposits:
          type: number
          format: double
          description: Total deposits in base asset
        unallocated_amount:
          type: number
          format: double
          description: Unallocated amount in base asset
        unallocated_amount_usd:
          type: number
          format: double
          description: Unallocated amount in USD
        user_count:
          type: number
          format: double
          description: User count
        withdrawals_usd:
          type: number
          format: double
          description: Withdrawals in USD
    ApiTemplateAsset:
      type: object
      required:
      - mint
      - yield_sources
      properties:
        mint:
          type: string
        yield_sources:
          $ref: '#/components/schemas/ApiTemplateYieldSource'
    ApiInputForDeletingEmptyStrategy:
      type: object
      required:
      - org_id
      - strategy_name
      properties:
        org_id:
          type: string
        strategy_name:
          type: string
    AdminStrategyListItem:
      type: object
      description: Strategy list item for admin back-office views (minimal for fast listing)
      required:
      - id
      - name
      - organization_name
      - assets
      - status
      - created_at
      - updated_at
      properties:
        assets:
          type: array
          items:
            type: string
          description: List of asset mints in this strategy
        created_at:
          type: integer
          format: int64
          description: Created timestamp
          minimum: 0
        id:
          type: string
          description: Strategy ID
        name:
          type: string
          description: Strategy name
        organization_name:
          type: string
          description: Organization name (from Breeze DB or Clerk)
        status:
          type: string
          description: Strategy status
        updated_at:
          type: integer
          format: int64
          description: Updated timestamp
          minimum: 0
    PaginationMeta:
      type: object
      description: Pagination metadata
      required:
      - page
      - per_page
      - total
      - total_pages
      - has_more
      properties:
        has_more:
          type: boolean
          description: Whether there are more pages
        page:
          type: integer
          format: int32
          description: Current page number
          minimum: 0
        per_page:
          type: integer
          format: int32
          description: Number of items per page
          minimum: 0
        total:
          type: integer
          format: int64
          description: Total number of items
          minimum: 0
        total_pages:
          type: integer
          format: int32
          description: Total number of pages
          minimum: 0
    RevokeOrganizationInviteRequest:
      type: object
      description: Request body for revoking an organization invitation
      required:
      - requesting_user_id
      properties:
        requesting_user_id:
          type: string
          description: User ID of the person requesting the revocation
    ApiInputForUpdatingStrategy:
      type: object
      required:
      - template_id
      - name
      - visibility_tags
      - assets
      - fees
      properties:
        assets:
          type: array
          items:
            $ref: '#/components/schemas/ApiTemplateAsset'
        description:
          type:
          - string
          - 'null'
        fees:
          type: array
          items:
            $ref: '#/components/schemas/ApiStrategyFee'
        name:
          type: string
        template_id:
          type: string
        visibility_tags:
          type: array
          items:
            type: string
    AdminFundAllocation:
      type: object
      description: Fund allocation detail for admin
      required:
      - index
      - yield_source_type
      - protocol
      - protocol_id
      - position_id
      - deposit_amount
      - current_value
      - deposit_timestamp
      properties:
        apy:
          type:
          - number
          - 'null'
          format: double
          description: Current APY for the allocation (from yield source)
        current_value:
          type: integer
          format: int64
          description: Current value (raw)
          minimum: 0
        deposit_amount:
          type: integer
          format: int64
          description: Deposit amount (raw)
          minimum: 0
        deposit_timestamp:
          type: integer
          format: int64
          description: Deposit timestamp
        index:
          type: integer
          format: int32
          description: Allocation index
          minimum: 0
        position_id:
          type: string
          description: Position ID
        protocol:
          type: string
          description: Protocol name
        protocol_id:
          type: string
          description: Protocol ID (yield source pubkey)
        yield_source_type:
          type: string
          description: Yield source type
    ApiYieldSourceTarget:
      type: object
      required:
      - yield_source_type
      - protocol
      properties:
        protocol:
          type: string
        yield_source_type:
          type: string
    AdminStrategyFundDetail:
      type: object
      description: Fund detail for admin strategy detail
      required:
      - fund_id
      - base_asset_mint
      - base_asset_decimals
      - current_value
      - current_value_usd
      - deposits
      - deposits_usd
      - allocated_to_yield
      - allocated_to_yield_usd
      - unallocated
      - unallocated_usd
      - user_count
      - asset_price_usd
      properties:
        allocated_to_yield:
          type: integer
          description: Allocated to yield in base asset
          minimum: 0
        allocated_to_yield_usd:
          type: number
          format: double
          description: Allocated to yield in USD
        asset_price_usd:
          type: number
          format: double
