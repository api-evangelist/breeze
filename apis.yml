aid: breeze
name: Breeze
description: >-
  Breeze is instant, non-custodial yield infrastructure for Solana. Any Solana app
  — wallets, payment products, trading platforms, Telegram bots, and AI agents — can
  embed automated yield for its users with a few lines of code via the Breeze REST
  API, a TypeScript SDK, prebuilt UI components, and an Agent Kit (MCP server, x402
  and MPP pay-per-call access, and a drop-in Agent Skill). Yield is generated on
  USDC, USDT, USDS, SOL and Solana LSTs (JitoSOL, mSOL, JupSOL) plus JLP while
  custody stays with the user and positions remain liquid and composable. Breeze was
  built by Anagram and is backed by Multicoin Capital.
